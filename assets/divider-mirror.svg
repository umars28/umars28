<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="26" viewBox="0 0 1200 26" role="img" aria-label="divider">
  <defs>
    <linearGradient id="flowr" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="0.8" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="1220 0" to="-620 0" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softr" x="-40%" y="-400%" width="180%" height="900%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <g stroke="#30363D" stroke-width="1.4" stroke-dasharray="6 6" opacity="0.7">
    <path d="M0 6 H1200"/>
    <path d="M0 20 H1200"/>
  </g>

  <rect x="0" y="12" width="1200" height="2" rx="1" fill="#30363D"/>
  <rect x="0" y="12" width="1200" height="2" rx="1" fill="url(#flowr)" filter="url(#softr)"/>
  <rect x="0" y="12" width="1200" height="2" rx="1" fill="url(#flowr)"/>

  <g>
    <rect x="0" y="9" width="70" height="8" rx="4" fill="#22D3EE" opacity="0.85">
      <animate attributeName="x" values="1130;0;1130" dur="7.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="9" width="40" height="8" rx="4" fill="#A78BFA" opacity="0.6">
      <animate attributeName="x" values="0;1160;0" dur="7.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

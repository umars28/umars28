<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="Roles over five years: software developer, software engineer, platform engineer, DevOps engineer">
  <defs>
    <linearGradient id="tLine" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.4" stop-color="#6366F1"/>
      <stop offset="0.75" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#28C840"/>
    </linearGradient>
    <linearGradient id="tSpark" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-240 0" to="1240 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="tCard"><rect x="8" y="8" width="1184" height="160" rx="14"/></clipPath>
    <pattern id="tGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="176" fill="#010409"/>
  <g clip-path="url(#tCard)">
    <rect x="8" y="8" width="1184" height="160" fill="#0D1117"/>
    <rect x="8" y="8" width="1184" height="160" fill="url(#tGrid)"/>
  </g>
  <rect x="8" y="8" width="1184" height="160" rx="14" fill="none" stroke="#30363D"/>

  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace">
    <text x="36" y="42" font-size="13" letter-spacing="2.5" fill="#6E7681">// PATH</text>
    <text x="1164" y="42" font-size="12" letter-spacing="1.5" fill="#8B949E" text-anchor="end">5 years</text>
  </g>

  <path d="M120 108 H1080" stroke="#21262D" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 108 H1080" stroke="url(#tLine)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M120 108 H1080" stroke="url(#tSpark)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace">

    <g>
      <path d="M180 108 V80" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="180" cy="108" r="9" fill="#0D1117" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="180" cy="108" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="180" y="74" font-size="11" letter-spacing="1.6" fill="#6E7681" text-anchor="middle">2021 — 2023</text>
      <text x="180" y="146" font-size="14" font-weight="700" letter-spacing="1.2" fill="#E6EDF3" text-anchor="middle">SOFTWARE DEVELOPER</text>
    </g>

    <g>
      <path d="M460 108 V80" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="460" cy="108" r="9" fill="#0D1117" stroke="#6366F1" stroke-width="2"/>
      <circle cx="460" cy="108" r="4" fill="#6366F1">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="460" y="74" font-size="11" letter-spacing="1.6" fill="#6E7681" text-anchor="middle">2023 — 2025</text>
      <text x="460" y="146" font-size="14" font-weight="700" letter-spacing="1.2" fill="#E6EDF3" text-anchor="middle">SOFTWARE ENGINEER</text>
    </g>

    <g>
      <path d="M740 108 V80" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="740" cy="108" r="9" fill="#0D1117" stroke="#A78BFA" stroke-width="2"/>
      <circle cx="740" cy="108" r="4" fill="#A78BFA">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="740" y="74" font-size="11" letter-spacing="1.6" fill="#6E7681" text-anchor="middle">2025 — 2026</text>
      <text x="740" y="146" font-size="14" font-weight="700" letter-spacing="1.2" fill="#E6EDF3" text-anchor="middle">PLATFORM ENGINEER</text>
    </g>

    <g>
      <path d="M1020 108 V80" stroke="#28C840" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle cx="1020" cy="108" r="13" fill="#0D1117" stroke="#28C840" stroke-width="2"/>
      <circle cx="1020" cy="108" r="5" fill="#28C840"/>
      <circle cx="1020" cy="108" r="13" fill="none" stroke="#28C840" stroke-width="2">
        <animate attributeName="r" values="13;24;13" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="1020" y="74" font-size="11" letter-spacing="1.6" fill="#28C840" text-anchor="middle">2026 — NOW</text>
      <text x="1020" y="146" font-size="14" font-weight="700" letter-spacing="1.2" fill="#28C840" text-anchor="middle">DEVOPS ENGINEER</text>
    </g>
  </g>
</svg>
